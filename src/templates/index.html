<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LendingClub - Nhập Dữ Liệu Khoản Vay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            max-width: 500px;
            width: 100%;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -10%;
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 8px;
            position: relative;
            z-index: 1;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
            position: relative;
            z-index: 1;
        }

        .form-content {
            padding: 40px 30px;
        }

        .form-group {
            margin-bottom: 25px;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .form-group:nth-child(1) { animation-delay: 0.1s; }
        .form-group:nth-child(2) { animation-delay: 0.2s; }
        .form-group:nth-child(3) { animation-delay: 0.3s; }
        .form-group:nth-child(4) { animation-delay: 0.4s; }
        .form-group:nth-child(5) { animation-delay: 0.5s; }
        .form-group:nth-child(6) { animation-delay: 0.6s; }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="number"] {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: #f8f9fa;
            color: #333;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
            transform: translateY(-2px);
        }

        input[type="number"]::placeholder {
            color: #999;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .submit-btn:active {
            transform: translateY(-1px);
        }

        .info-box {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
            border-left: 4px solid #667eea;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-size: 13px;
            color: #555;
            line-height: 1.6;
        }

        .info-box strong {
            color: #667eea;
        }

        .success-message {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            padding: 18px 24px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(16, 185, 129, 0.3);
            display: none;
            z-index: 1000;
            animation: slideInRight 0.5s ease-out;
            align-items: center;
            gap: 12px;
        }

        .success-message.show {
            display: flex;
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(100px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .success-message svg {
            width: 24px;
            height: 24px;
            flex-shrink: 0;
        }

        @media (max-width: 480px) {
            .header {
                padding: 30px 20px;
            }

            .header h1 {
                font-size: 24px;
            }

            .form-content {
                padding: 25px 20px;
            }

            .success-message {
                top: 10px;
                right: 10px;
                left: 10px;
                justify-content: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💳 LendingClub</h1>
            <p>Hệ thống Phân tích Dữ liệu Khoản Vay</p>
        </div>
        <div class="form-content">
            <div class="info-box">
                <strong>ℹ️ Hướng dẫn:</strong> Vui lòng nhập thông tin chi tiết khoản vay để tiếp tục phân tích.
            </div>
            <form id="loanForm">
                <div class="form-group">
                    <label for="int_rate">📊 Lãi suất (%)</label>
                    <input type="number" step="0.01" name="int_rate" id="int_rate" placeholder="Ví dụ: 12.50" required>
                </div>

                <div class="form-group">
                    <label for="fico_range_low">🏆 Điểm FICO tối thiểu</label>
                    <input type="number" name="fico_range_low" id="fico_range_low" placeholder="Ví dụ: 670" required>
                </div>

                <div class="form-group">
                    <label for="funded_amnt">💰 Số tiền được tài trợ (USD)</label>
                    <input type="number" step="0.01" name="funded_amnt" id="funded_amnt" placeholder="Ví dụ: 15000.00" required>
                </div>

                <div class="form-group">
                    <label for="dti">📉 Tỷ lệ Nợ/Thu nhập (DTI)</label>
                    <input type="number" step="0.01" name="dti" id="dti" placeholder="Ví dụ: 25.50" required>
                </div>

                <div class="form-group">
                    <label for="annual_inc">💵 Thu nhập hàng năm (USD)</label>
                    <input type="number" step="0.01" name="annual_inc" id="annual_inc" placeholder="Ví dụ: 50000.00" required>
                </div>

                <div class="form-group">
                    <label for="pub_rec">📋 Số bản ghi công khai</label>
                    <input type="number" name="pub_rec" id="pub_rec" placeholder="Ví dụ: 0" required>
                </div>

                <div class="form-group">
                    <label for="open_acc">🔓 Số tài khoản mở</label>
                    <input type="number" name="open_acc" id="open_acc" placeholder="Ví dụ: 5" required>
                </div>

                <div class="form-group">
                    <label for="total_acc">🏦 Tổng số tài khoản</label>
                    <input type="number" name="total_acc" id="total_acc" placeholder="Ví dụ: 12" required>
                </div>

                <div class="form-group">
                    <label for="delinq_2yrs">⚠️ Số lần quá hạn trong 2 năm</label>
                    <input type="number" name="delinq_2yrs" id="delinq_2yrs" placeholder="Ví dụ: 0" required>
                </div>

                <div class="form-group">
                    <label for="acc_now_delinq">🚨 Số tài khoản quá hạn hiện tại</label>
                    <input type="number" name="acc_now_delinq" id="acc_now_delinq" placeholder="Ví dụ: 0" required>
                </div>

                <button type="submit" class="submit-btn">✓ Gửi Dữ Liệu</button>
            </form>
        </div>
    </div>

    <div class="success-message" id="successMessage">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
        <span>Gửi dữ liệu thành công! ✓</span>
    </div>

    <script>
        const form = document.getElementById('loanForm');
        const successMessage = document.getElementById('successMessage');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const formData = new FormData(form);

            try {
                const response = await fetch('/submit', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    // Hiển thị thông báo thành công
                    successMessage.classList.add('show');

                    // Reset form
                    form.reset();

                    // Ẩn thông báo sau 5 giây
                    setTimeout(() => {
                        successMessage.classList.remove('show');
                    }, 5000);
                } else {
                    alert('Có lỗi xảy ra. Vui lòng thử lại.');
                }
            } catch (error) {
                alert('Lỗi kết nối: ' + error.message);
            }
        });
    </script>
</body>
</html>
